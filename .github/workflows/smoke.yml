name: smoke

# Tier 2: the real mission in Gazebo, on a self-hosted runner.
#
# Why self-hosted: the image (multi-agent-uavs:jazzy) is about 25 GB, a hosted
# runner has about 14 GB of free disk, and a build there needs roughly twice
# the image. So this job runs on the maintainer's own machine, where the image
# already exists, and is never offered to pull requests: a self-hosted runner
# on a public repo runs whatever a fork's PR contains. The only trigger is a
# manual dispatch (`gh workflow run smoke.yml`): the runner is the maintainer's
# machine and is often off, and a push trigger would queue a job per push that
# GitHub fails after about 24 hours with no runner, leaving red marks on main.
#
# Runner setup (Settings > Actions > Runners > New self-hosted runner), with
# the label `uav-smoke`; the runner's user must be in the docker group and
# have uid 1000 (the image's `ros` user), and the USB Docker data partition
# must be mounted (docker-notes 38). The WinBoat VM must be stopped.
#
# Ran green on the maintainer's runner on 2026-11-23 (run 45134386843).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, linux, uav-smoke]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Machine is free for a sim
        run: |
          # One sim at a time: SITL's TCP 5760 and UDP 9002 are fixed ports,
          # and the host network is shared with every container.
          if ss -lntu | grep -E ':(5760|9002)\b'; then
            echo "a sim is already running here (ports above); stop it first"; exit 1
          fi
          if docker ps --format '{{.Names}}' | grep -i winboat; then
            echo "WinBoat is running; stop it before any sim work"; exit 1
          fi
          docker image inspect multi-agent-uavs:jazzy >/dev/null

      - name: Build, unit tests and smoke test in the image
        run: |
          docker run --rm --init \
            --network host --ipc host \
            -e ROS_DOMAIN_ID=0 \
            -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            -e 'CYCLONEDDS_URI=<CycloneDDS><Domain id="any"><Discovery><MaxAutoParticipantIndex>119</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>' \
            -v "$PWD":/workspaces/multi-agent-uavs \
            multi-agent-uavs:jazzy \
            bash -l /workspaces/multi-agent-uavs/ci/in_container.sh
